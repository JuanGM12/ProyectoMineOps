openapi: 3.1.0
info:
  title: MineOps Planning Service API
  version: 0.1.0
  description: Contrato base del microservicio Planning Service.
servers:
  - url: http://localhost:8000/api/v1
paths:
  /health:
    get:
      summary: Consultar el estado del servicio
      operationId: healthCheck
      responses:
        '200':
          description: Servicio disponible
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: {type: boolean, example: true}
                  data:
                    type: object
                    required: [service, status]
                    properties:
                      service: {type: string, example: planning-service}
                      status: {type: string, example: ok}
